<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  body { width:1900px; padding:36px 44px; background:#fff; }
  h1 { text-align:center; font-size:30px; margin-bottom:10px; }
  .sub { text-align:center; color:#666; font-size:16px; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns: 520px 90px 640px 90px 520px; align-items:center; }
  .colh { text-align:center; font-size:20px; font-weight:bold; padding:12px 0; border-radius:10px; margin-bottom:6px;}
  .ch1 { background:#fdf3e7; color:#d35400; } .ch2 { background:#eef2fa; color:#2f6fd6; } .ch3 { background:#fdeaea; color:#c0392b; }
  .cell { padding:10px 6px; display:flex; justify-content:center; align-items:center; }
  .cellcol { flex-direction:column; gap:16px; }
  .arrow { text-align:center; font-size:30px; color:#888; font-family:Consolas,monospace; }
  .arrow .lbl { display:block; font-size:13px; color:#888; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .spacer { height:26px; grid-column:1/-1; }
  .vflow { text-align:center; color:#2f6fd6; font-size:26px; }
  .box { background:#fff; border-radius:10px; padding:14px 20px; border:3px solid #888; width:100%; }
  .box h3 { font-size:19px; margin-bottom:8px; }
  .box ul { padding-left:20px; font-size:15px; line-height:1.7; color:#333; }
  .bl { border-color:#2f6fd6; } .bl h3{color:#2f6fd6;}
  .bg { border-color:#94a3b8; background:#f8fafc; } .bg h3{color:#64748b;}
  .bp { border-color:#7c3aed; } .bp h3{color:#7c3aed;}
  .be { border-color:#c0392b; background:#fdf6f5; } .be h3{color:#c0392b;}
  .hl { color:#d35400; font-weight:bold; }
  .mth { color:#1a1a8a; font-weight:bold; }
  .uml { background:#fff; border:2.5px solid #d35400; width:100%; font-family:"JetBrains Mono",Consolas,monospace; }
  .uml .title { text-align:center; font-weight:bold; font-size:17px; padding:9px 14px; color:#d35400; border-bottom:2.5px solid #d35400; background:#fdf3e7; }
  .uml .body { padding:12px 16px; font-size:14px; line-height:1.7; color:#333; }
  .uml.cfg { border-color:#555; }
  .uml.cfg .title { color:#444; border-bottom-color:#555; background:#f4f4f5; }
  .tag { font-size:13px; color:#888; font-weight:normal; }
  .legend { border:2px solid #ccc; border-radius:10px; padding:16px 22px; font-size:15px; color:#555; margin-top:26px; }
</style></head><body>
<!--BODY-->
</body></html>
